    pay_range_eur: [1200, 3500]

education_tree:
  electrical_safety_1:
    id: "electrical_safety_1"
    name: "Sähköturvallisuus & Tulityöt"
    cost_eur: 250
    duration_days: 1
    req_level: 1
  plc_basics_1:
    id: "plc_basics_1"
    name: "PLC-Automaation Perusteet"
    cost_eur: 800
    duration_days: 3
    req_level: 3
  robotics_1:
    id: "robotics_1"
    name: "Robotiikka & Anturitekniikka"
    cost_eur: 2500
