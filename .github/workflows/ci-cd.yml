name: CI/CD Pipeline & Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Estetään päällekkäiset ajot samassa haarassa/PR:ssä resurssien säästämiseksi
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Oletuksena tiukka vähimmäisoikeusperiaate (Least Privilege)
permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. GO BACKEND: Linting, Race-Condition Yksikkötestit & Binäärikäännös
  # ============================================================================
  backend:
    name: Go Backend (Vet, Lint, Test & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify Go dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend

      - name: Run Go unit tests with Race Detector
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build Go engine binary
        run: go build -v -o bin/server ./cmd/server/main.go

  # ============================================================================
  # 2. FRONTEND & NODE: TypeScript, React Compiler, Yksikkötestit & Vite Build
  # ============================================================================
  frontend:
    name: Frontend & Node (Typecheck, Test & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (Clean Install)
        run: npm ci

      - name: Secret leak guard (Ensure no hardcoded Google API keys in source)
        run: |
          if grep -rn "AIzaSy" src/ backend/ public/ index.html server.ts; then
            echo "::error::Hardcoded Google API key detected in source code!"
            exit 1
          fi

      - name: TypeScript & React Compiler verification (Lint)
        run: npm run lint

      - name: Run Frontend & Store unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  # ============================================================================
  # 3. DOCKER BUILDX & GHCR: Monivaiheinen kontitus, GHA-välimuisti & Julkaisu
  # ============================================================================
  docker:
    name: Docker Buildx & Publish (GHCR)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Pull Requesteissa vain testataan kontin kääntyminen (push: false),
          # main-haarassa ja tageissa julkaistaan kuva GHCR-rekisteriin (push: true).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
